server:
  port: 8082

spring:
  application:
    name: pricing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
  # У каждого сервиса своя схема в общей базе
  flyway:
    schemas: pricing
    default-schema: pricing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: pricing

account:
  url: ${ACCOUNT_URL:http://localhost:8081}
