server:
  port: 8082

spring:
  application:
    name: pricing
  # Тайм-ауты всех HTTP-клиентов по умолчанию: зависший сосед не держит поток бесконечно
  http:
    clients:
      connect-timeout: ${HTTP_CONNECT_TIMEOUT:1s}
      read-timeout: ${HTTP_READ_TIMEOUT:5s}
    serviceclient:
      account:
        base-url: ${ACCOUNT_URL:http://localhost:8081}
        connect-timeout: 1s
        read-timeout: 2s
      biller:
        base-url: ${BILLER_URL:http://localhost:8087}
        connect-timeout: 1s
        read-timeout: 2s
  # Redis: кэш профиля и групп поставщиков
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis недоступен — отказ за секунды (кэш идёт мимо, readiness — DOWN), а не ожидание по минуте
      connect-timeout: 1s
      timeout: 2s
      repositories:
        enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    # search_path соединения — своя схема, в том числе для нативных SQL-запросов
    hikari:
      schema: pricing
  # У каждого сервиса своя схема в общей базе (создаётся в infra/postgres/init.sql)
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: pricing
    liquibase-schema: pricing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: pricing

# Общий с payment секрет для подписи котировок
quote:
  # Только из окружения: значения по умолчанию у секрета нет
  secret: ${QUOTE_SECRET}
  # Сколько живёт котировка
  ttl: 10m

# Общая библиотека libs/platform
platform:
  # Swagger: описание API и коды ошибок в схеме Problem
  openapi:
    description: "Комиссии, тарифы и подписанные котировки"
    error-codes: com.paymentsapp.pricing.error.PricingError
  time:
    zone: Europe/Moscow
  cache:
    enabled: true
    version: v1
    ttl:
      # Профиль: подписка и счета — коротко, чтобы новая подписка или карта появились быстро
      account-user: 30s
      provider-group: 1h

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
    instances:
      account: { base-config: default }
      biller: { base-config: default }
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 100ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
    instances:
      account: { base-config: default }
      biller: { base-config: default }
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 100
        max-wait-duration: 50ms
    instances:
      account: { base-config: default }
      biller: { base-config: default }

# Actuator: /actuator/health — liveness (процесс жив) и readiness (готов принимать запросы: есть БД и Redis);
# по ним healthcheck в compose и пробы Kubernetes. Остановка — плавная (по умолчанию в Spring Boot): новые запросы
# не принимаем, текущие дорабатывают
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

springdoc:
  # Swagger UI и спецификация включены; в проде можно выключить: SWAGGER_ENABLED=false
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
